name: CI

on:
  push:
  pull_request:

# O CI só lê o repositório.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lanceauto
          POSTGRES_PASSWORD: lanceauto
          POSTGRES_DB: lanceauto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanceauto -d lanceauto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lanceauto:lanceauto@localhost:5432/lanceauto_test
      DIRECT_URL: postgresql://lanceauto:lanceauto@localhost:5432/lanceauto_test
      DATABASE_URL_TEST: postgresql://lanceauto:lanceauto@localhost:5432/lanceauto_test
      # Valores de dev, válidos (>= 32 caracteres) e nunca usados em produção.
      JWT_SECRET: ci-jwt-secret-nao-usar-em-producao-0123456789abcdef
      AUDIT_HMAC_KEY: ci-audit-hmac-key-nao-usar-em-producao-0123456789abcdef
      RATE_LIMIT_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      # As migrações têm SQL escrito à mão: o banco migrado precisa bater com o schema.prisma (exit 2 se divergir).
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
